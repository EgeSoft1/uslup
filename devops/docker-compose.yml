# =============================================================================
# TurkiyeMesajlasma - Yerel Geliştirme Ortamı (Local Dev)
# Dosya: devops/docker-compose.yml
#
# Bu dosya tüm veritabanı yığınını ve mesajlaşma ağ geçidini yerel olarak 
# ayağa kaldırmak içindir.
# =============================================================================

version: '3.8'

services:
  # ── 1. RUST GATEWAY ──────────────────────────────────────────────────────────
  gateway-ws:
    build:
      context: ../
      dockerfile: devops/docker/gateway.Dockerfile
    ports:
      - "8080:8080" # WebSocket Portu
      - "9090:9090" # gRPC Portu
      - "9091:9091" # Metrics Portu
    environment:
      - RUST_LOG=info
      - LISTEN_ADDR=0.0.0.0:8080
      - DRAGONFLY_CLUSTER_URLS=redis://dragonfly:6379
      - COCKROACHDB_URL=postgresql://root@cockroachdb:26257/turkiye_mesajlasma?sslmode=disable
      - SCYLLADB_HOSTS=scylladb
      - JWT_PUBLIC_KEY=ZGVmYXVsdC1kZXYta2V5LXBsZWFzZS1jaGFuZ2UtbWU= # Örnek Base64 key
      - JWT_ISSUER=turkiye-mesajlasma.local
    # depends_on:
    #   - dragonfly
    #   - cockroachdb
    #   - scylladb
    #   - clickhouse
    networks:
      - tm_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ── 2. DRAGONFLYDB (In-Memory Pub/Sub & Presence) ────────────────────────────
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    command: 
      - "--proactor_threads=4"  # CPU çekirdek sayısına göre optimize et
      - "--cache_mode=true"
    networks:
      - tm_net

  # ── 3. COCKROACHDB (İlişkisel Veri & Key Management) ─────────────────────────
  cockroachdb:
    image: cockroachdb/cockroach:v23.1.5
    ports:
      - "26257:26257"
      - "8081:8080" # Admin UI
    command: start-single-node --insecure
    volumes:
      - crdb_data:/cockroach/cockroach-data
    networks:
      - tm_net

  # ── 4. SCYLLADB (Mesaj Depolama & Offline Kuyruk) ────────────────────────────
  scylladb:
    image: scylladb/scylla:5.2.0
    ports:
      - "9042:9042" # CQL Port
    command: --smp 2 --memory 2G --overprovisioned 1 --api-address 0.0.0.0
    volumes:
      - scylla_data:/var/lib/scylla
    networks:
      - tm_net

  # ── 5. CLICKHOUSE (Lawful Intercept & Analytics) ─────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123" # HTTP Port
      - "9000:9000" # TCP Port
    volumes:
      - ch_data:/var/lib/clickhouse
    networks:
      - tm_net

networks:
  tm_net:
    driver: bridge

volumes:
  crdb_data:
  scylla_data:
  ch_data:
