<text x="118" y="352.0" font-size="16" fill="#1a1a1a" font-weight="bold" text-anchor="start" dominant-baseline="central">Nefret söylemi</text>
<text x="396" y="352.0" font-size="14.5" fill="#6e6864" text-anchor="start" dominant-baseline="central">Kimlik hedefli düşmanlık; kimlik adı tetikleyici değil</text>
