# =============================================================================
# ScyllaDB Production Konfigürasyonu
# Dosya: /etc/scylla/scylla.yaml
# Platform: TurkiyeMesajlasma - 150M+ CCU Mesajlaşma Platformu
# Node Donanımı Hedefi: 32+ vCPU, 256GB RAM, NVMe SSD
# =============================================================================

# ---------------------------------------------------------------------------
# CLUSTER TANIMLAMASI
# ---------------------------------------------------------------------------
cluster_name: 'turkiye-mesajlasma-prod'

# Multi-DC snitch: Veri merkezi ve rack topolojisini tanır
endpoint_snitch: GossipingPropertyFileSnitch
# Her node'da /etc/scylla/cassandra-rackdc.properties dosyası:
#   dc=tr_dc      (veya eu_dc)
#   rack=rack1    (veya rack2, rack3 - AZ'ye göre)

# ---------------------------------------------------------------------------
# AĞ KONFİGÜRASYONU
# ---------------------------------------------------------------------------
# Dinlenecek IP (production'da gerçek IP, docker'da 0.0.0.0)
listen_address: auto           # ScyllaDB otomatik IP algılar

# İstemci RPC adresi (CQL bağlantıları)
rpc_address: 0.0.0.0
broadcast_rpc_address: <NODE_PUBLIC_IP>    # deployment sırasında set edilir

# Native transport (CQL)
native_transport_port: 9042
native_transport_port_ssl: 9142    # TLS ile CQL

# Inter-node iletişim
storage_port: 7000
ssl_storage_port: 7001

# Gossip protokolü
seed_provider:
  - class_name: org.apache.cassandra.locator.SimpleSeedProvider
    parameters:
      - seeds: "scylla-seed-1.internal,scylla-seed-2.internal,scylla-seed-3.internal"

# ---------------------------------------------------------------------------
# DEPOLAMA KONFİGÜRASYONU
# ---------------------------------------------------------------------------
data_file_directories:
  - /var/lib/scylla/data    # NVMe SSD mount noktası

commitlog_directory: /var/lib/scylla/commitlog    # Ayrı SSD (write latency için)
hints_directory: /var/lib/scylla/hints
view_hints_directory: /var/lib/scylla/view_hints

# ---------------------------------------------------------------------------
# BELLEK KONFİGÜRASYONU
# ---------------------------------------------------------------------------
# ScyllaDB Shared Nothing mimarisi: Her shard bir CPU core'a bağlı
# 256GB RAM node'unda ~80% ScyllaDB'ye ayrılır
developer_mode: false

# Cache boyutları (otomatik hesaplama)
# file_cache_size_in_mb: 0   # ScyllaDB kendi yönetir

# Row cache: Hot partition'lar için (presence, son görülme)
row_cache_size_in_mb: 8192    # 8 GB row cache

# ---------------------------------------------------------------------------
# YAZMA PERFORMANSI
# ---------------------------------------------------------------------------
# CommitLog senkronizasyonu
commitlog_sync: periodic
commitlog_sync_period_in_ms: 10000    # 10 saniye (veri kaybı penceresi)
commitlog_segment_size_in_mb: 32

# Batch boyutu uyarısı
batch_size_warn_threshold_in_kb: 64
batch_size_fail_threshold_in_kb: 640

# Eşzamanlı yazma
concurrent_writes: 128           # 32 CPU core için
concurrent_reads: 64
concurrent_counter_writes: 16

# ---------------------------------------------------------------------------
# COMPACTION
# ---------------------------------------------------------------------------
# TWCS için özel ayarlar (messages tablosu)
compaction_throughput_mb_per_sec: 64    # Compaction I/O bant genişliği limiti
concurrent_compactors: 4                # Eşzamanlı compaction işçisi

# ---------------------------------------------------------------------------
# TLS / GÜVENLİK
# ---------------------------------------------------------------------------
server_encryption_options:
  internode_encryption: all    # Node-to-node trafik şifreli
  certificate: /etc/scylla/ssl/scylla.crt
  keyfile: /etc/scylla/ssl/scylla.key
  truststore: /etc/scylla/ssl/ca.crt
  require_client_auth: true   # Mutual TLS (mTLS)

client_encryption_options:
  enabled: true
  certificate: /etc/scylla/ssl/scylla.crt
  keyfile: /etc/scylla/ssl/scylla.key
  require_client_auth: true

# ---------------------------------------------------------------------------
# KİMLİK DOĞRULAMA
# ---------------------------------------------------------------------------
authenticator: PasswordAuthenticator    # Üretim: LDAP/Kerberos entegrasyonu
authorizer: CassandraAuthorizer
role_manager: CassandraRoleManager

# ---------------------------------------------------------------------------
# ZAMAN DAMGASI
# ---------------------------------------------------------------------------
# CRDTs ve eventual consistency için
enable_user_defined_functions: false    # Güvenlik: UDF kapalı
enable_scripted_user_defined_functions: false

# ---------------------------------------------------------------------------
# PERFORMANS İYİLEŞTİRMELERİ
# ---------------------------------------------------------------------------
# Speculative execution (tail latency'yi önler)
request_timeout_in_ms: 5000
range_request_timeout_in_ms: 10000
write_request_timeout_in_ms: 2000
cas_contention_timeout_in_ms: 1000

# Okuma onarımı (kapalı: yüksek yazım ortamında overhead yaratır)
read_repair_chance: 0.0
dc_local_read_repair_chance: 0.0

# Tombstone uyarı eşikleri
tombstone_warn_threshold: 1000
tombstone_failure_threshold: 100000

# ---------------------------------------------------------------------------
# LOGging
# ---------------------------------------------------------------------------
log_snapshot_interval_in_ms: 300000    # 5 dakikada bir durum raporu
