# =============================================================================
# TurkiyeMesajlasma - DragonflyDB Kubernetes StatefulSet
# Dosya: devops/k8s/dragonfly-statefulset.yaml
#
# Amaç: Presence (Son Görülme), Rate-Limiting ve Node-to-Node Pub/Sub
# mekanizmaları için multi-threaded (Redis uyumlu) bellek içi veri deposu.
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dragonfly
  namespace: turkiye-mesajlasma
spec:
  serviceName: "dragonfly-headless"
  replicas: 3 # Yüksek erişilebilirlik (HA) için en az 3 node (Master - Replica - Replica)
  selector:
    matchLabels:
      app: dragonfly
  template:
    metadata:
      labels:
        app: dragonfly
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - dragonfly
            topologyKey: kubernetes.io/hostname
            
      # Kernel düzeyinde kilitlenmeyen bellek izinleri (Lock-free memory)
      securityContext:
        sysctls:
        - name: vm.overcommit_memory
          value: "1"

      containers:
      - name: dragonfly
        image: docker.dragonflydb.io/dragonflydb/dragonfly
        ports:
        - containerPort: 6379
          name: redis
          
        command:
        - "dragonfly"
        # Redis cluster modunu açar, birden çok işlemci çekirdeğini sonuna kadar kullanır
        - "--proactor_threads=16" 
        - "--cache_mode=true"       # LRU mantığı, TTL'si dolanları direkt atar
        - "--maxmemory=60G"         # Limite yaklaşıldığında eski presence bilgilerini ezer
        - "--bind=0.0.0.0"

        resources:
          requests:
            cpu: "16"
            memory: "64Gi"
          limits:
            cpu: "16"
            memory: "64Gi"
            
        # Belleği takas (swap) dosyasına dökmemesi için
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
