<text x="118" y="290.0" font-size="16" fill="#1a1a1a" font-weight="bold" text-anchor="start" dominant-baseline="central">Edimbilimsel örüntü</text>
<text x="396" y="290.0" font-size="14.5" fill="#6e6864" text-anchor="start" dominant-baseline="central">Küfürsüz düşmanlık — kelimede değil, dizilişte</text>
<rect x="54" y="324" width="792" height="56" rx="8" fill="#fff" stroke="#e4dcd6" stroke-width="1.2"/>
