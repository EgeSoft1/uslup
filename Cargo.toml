[workspace]
resolver = "2"
members = [
    "crates/gateway-ws",       # WebSocket Gateway (Axum + Tungstenite)
    "crates/message-service",  # Mesaj işleme servisi
    "crates/presence-service", # Presence ve Pub/Sub servisi
    "crates/auth-service",     # Kimlik doğrulama servisi
    "crates/crypto-engine",    # Signal Protocol şifreleme motoru
    "crates/domain",           # Domain modelleri ve soyut arayüzler
    "crates/infrastructure",   # DB driver'ları ve dış bağlantılar
    "crates/proto",            # gRPC Protobuf tanımları (Tonic)
    "crates/common",           # Paylaşılan yardımcı araçlar, config, hata tipleri
]

[workspace.dependencies]
# ─── Async Runtime ─────────────────────────────────────────────────────────────
tokio          = { version = "1.40", features = ["full", "tracing"] }
tokio-stream   = { version = "0.1" }

# ─── Web Framework ─────────────────────────────────────────────────────────────
axum           = { version = "0.7", features = ["ws", "macros", "multipart"] }
axum-extra     = { version = "0.9", features = ["typed-header"] }
tower          = { version = "0.5", features = ["full"] }
tower-http     = { version = "0.6", features = ["full"] }

# ─── gRPC ──────────────────────────────────────────────────────────────────────
tonic          = { version = "0.12", features = ["tls", "transport", "gzip"] }
tonic-build    = { version = "0.12" }
prost          = { version = "0.13" }
prost-types    = { version = "0.13" }

# ─── Serialization ─────────────────────────────────────────────────────────────
serde          = { version = "1.0", features = ["derive"] }
serde_json     = { version = "1.0" }
bytes          = { version = "1.7" }
prost-codec    = { version = "0.2" }

# ─── Database Drivers ──────────────────────────────────────────────────────────
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = { version = "0.14" }
scylla         = { version = "0.13", features = ["ssl"] }    # ScyllaDB Rust driver
fred           = { version = "9.0", features = ["i-all", "enable-rustls", "i-cluster"] } # DragonflyDB (Redis)
clickhouse     = { version = "0.12", features = ["lz4", "watch", "inserter"] }

# ─── Cryptography ──────────────────────────────────────────────────────────────
ring           = { version = "0.17" }
argon2         = { version = "0.5" }
sha2           = { version = "0.10" }
hmac           = { version = "0.12" }
rand           = { version = "0.8" }
rand_core      = { version = "0.6" }
zeroize        = { version = "1.8", features = ["derive"] }  # Sıfır-bellekli anahtar temizleme
secrecy        = { version = "0.8" }                          # Gizli değer sarmalayıcı

# ─── JWT / Auth ────────────────────────────────────────────────────────────────
jsonwebtoken   = { version = "9.3" }

# ─── Observability ─────────────────────────────────────────────────────────────
tracing        = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry  = { version = "0.24" }
opentelemetry-otlp = { version = "0.17" }
metrics        = { version = "0.23" }
metrics-exporter-prometheus = { version = "0.15" }

# ─── Configuration ─────────────────────────────────────────────────────────────
config         = { version = "0.14", features = ["toml"] }
dotenvy        = { version = "0.15" }
clap           = { version = "4.5", features = ["derive", "env"] }

# ─── Utility ───────────────────────────────────────────────────────────────────
uuid           = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono         = { version = "0.4", features = ["serde"] }
anyhow         = { version = "1.0" }
thiserror      = { version = "1.0" }
dashmap        = { version = "6.0" }    # Lock-free concurrent HashMap
arc-swap       = { version = "1.7" }
futures        = { version = "0.3" }
async-trait    = { version = "0.1" }
pin-project    = { version = "1.0" }
smallvec       = { version = "1.13" }   # Stack-allocated small arrays
once_cell      = { version = "1.19" }
parking_lot    = { version = "0.12" }   # Hızlı mutex/rwlock
socket2        = { version = "0.5", features = ["all"] }
mimalloc       = { version = "0.1.43" }
base64         = { version = "0.22.1" }

[profile.release]
opt-level     = 3
lto           = "fat"        # Link-Time Optimization: %10-30 performans artışı
codegen-units = 1            # Tek code gen unit: maksimum optimizasyon
panic         = "abort"      # Unwinding overhead yok — %5 küçülme
strip         = "symbols"    # Debug sembolleri soyunca %70 küçük binary
overflow-checks = false      # Release'de overflow check kapatıldı (performans)

[profile.release.build-override]
opt-level = 3

[profile.dev]
opt-level = 1                # Geliştirme modunda kısmi optimizasyon
debug     = true

[profile.bench]
inherits      = "release"
debug         = true
