<text x="396" y="228.0" font-size="14.5" fill="#6e6864" text-anchor="start" dominant-baseline="central">Eklemeli yapıda kök eşleşmesi: aptallığın → aptal</text>
<rect x="54" y="262" width="792" height="56" rx="8" fill="#fff" stroke="#e4dcd6" stroke-width="1.2"/>
