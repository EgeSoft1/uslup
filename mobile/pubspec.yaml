# =============================================================================
# TurkiyeMesajlasma - Flutter Mobil İstemci Bağımlılıkları
# Dosya: mobile/pubspec.yaml
# =============================================================================
name: turkiye_mesajlasma
description: "150M+ CCU, Zero-lag, Ultra Şifrelenmiş Kurumsal Mesajlaşma Platformu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Nezaket motoru — saf Dart, Flutter'sız. Sunucu (server/) ile ORTAK.
  # Tek kaynak: cihaz ile bulut aynı sınıflandırıcıyı çağırır.
  civility_core:
    path: ../packages/civility_core

  # UI / UX
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Ağ — bulut kademesi (POST /v1/rewrite)
  dio: ^5.4.3

  # QR Kod (oluşturma ve tarama)
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  pinput: ^6.0.2
  country_picker: ^2.0.28

# ── KALDIRILAN BAĞIMLILIKLAR (3 Ağustos 2026) ────────────────────────────────
# Aşağıdakiler devralınan mesajlaşma altyapısından kalmıştı ve hiçbir yerde
# kullanılmıyordu; APK'ya giriyor ama tek satır kod çalıştırmıyorlardı:
#
#   flutter_bloc, equatable  — projede tek bir BlocProvider yoktu
#   sqflite, path_provider   — sıfır import; kalıcı depolama hiç yazılmadı
#   ffi                      — sıfır import; ffi_bridge.dart onu import bile
#                              etmiyordu, tamamen sahte bir modüldü
#   web_socket_channel, uuid — yalnızca ölü WebSocket katmanında
#   protobuf                 — sıfır import
#
# Bağlı olmayan katmanlar, çalışan çekirdeğin güvenilirliğini düşürür.
# Gerektiğinde geri eklenebilir: git geçmişinde duruyorlar.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
