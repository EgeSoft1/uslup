# =============================================================================
# Sürekli tümleştirme (docs/24 · madde 44)
#
# Üç iş:
#   1. motor     — civility_core: analiz, test, yeniden yazma kalite kapısı
#   2. olcum     — bütün etiketli kümelerin ölçümü; çıktı artefakt olarak
#                  saklanır. Bir PR ölçümü değiştiriyorsa bu dosya karşılaştırılır.
#   3. istemci   — Flutter: analiz ve test (demo güvencesi, kapsam değişmezleri,
#                  ölçüm tutarlılığı dâhil)
#
# Ağ yalnızca bağımlılık indirmek için kullanılır; testlerin hiçbiri ağ istemez.
#
# Runner SABİTLENMİŞTİR (ubuntu-24.04, `ubuntu-latest` değil). Sebep:
# `ubuntu-latest` 19 Ekim 2026'da Ubuntu 26'ya geçiyor. Yarışma penceresinde
# ölçümlerin aynı ortamda üretilmesi, bir gecede değişen bir tabanda
# üretilmesine yeğlenir. Taban yükseltmesi bilinçli bir commit olmalıdır.
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  motor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/civility_core
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      # Kalıp çöküşü (tek önerinin payı > %50) ya da dilbilgisi şüphesi
      # varsa araç sıfırdan farklı kodla çıkar.
      - run: dart run bin/rewrite_audit.dart --hepsi --ornek=0

  olcum:
    runs-on: ubuntu-24.04
    needs: motor
    defaults:
      run:
        working-directory: packages/civility_core
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run bin/evaluate.dart --hepsi | tee olcum.txt
      - uses: actions/upload-artifact@v7
        with:
          name: olcum
          path: packages/civility_core/olcum.txt

  istemci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
