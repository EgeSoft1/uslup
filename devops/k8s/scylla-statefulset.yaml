# =============================================================================
# TurkiyeMesajlasma - ScyllaDB Kubernetes StatefulSet
# Dosya: devops/k8s/scylla-statefulset.yaml
#
# Amaç: Milyarlarca mesajı saklamak için Cassandra/ScyllaDB'yi K8s üzerinde
# kalıcı depolama (PersistentVolume) ile çalıştırmak. (TimeWindowCompactionStrategy)
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scylladb
  namespace: turkiye-mesajlasma
spec:
  serviceName: "scylladb-headless"
  replicas: 6 # Başlangıçta 6 node'luk cluster (Örn: 2 DataCenter x 3 Node)
  selector:
    matchLabels:
      app: scylladb
  template:
    metadata:
      labels:
        app: scylladb
    spec:
      # Veritabanı node'ları kesinlikle farklı fiziksel makinelere gitmeli
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - scylladb
            topologyKey: kubernetes.io/hostname
            
      containers:
      - name: scylladb
        image: scylladb/scylla:5.2.0
        ports:
        - containerPort: 9042
          name: cql
        - containerPort: 7000
          name: intra-node
        - containerPort: 9180
          name: prometheus
          
        # ScyllaDB OS Optimizasyon komutları (K8s üzerinde)
        command:
        - /docker-entrypoint.py
        - "--smp 8"             # 8 Çekirdek Kullanımı (CPU Pinning)
        - "--memory 32G"        # 32 GB RAM Tahsisi
        - "--developer-mode=0"  # Production Modu
        - "--overprovisioned=1" # K8s ortamında CPU paylaşım uyarısını kapatır

        env:
        - name: SCYLLA_CLUSTER_NAME
          value: "tm-messaging-cluster"
        - name: SCYLLA_SEEDS
          value: "scylladb-0.scylladb-headless.turkiye-mesajlasma.svc.cluster.local,scylladb-1.scylladb-headless.turkiye-mesajlasma.svc.cluster.local"
          
        resources:
          requests:
            cpu: "8"
            memory: "32Gi"
          limits:
            cpu: "8"
            memory: "32Gi"
            
        volumeMounts:
        - name: scylla-data
          mountPath: /var/lib/scylla

  # NVMe SSD Disklerin Pod'lara Otomatik Bağlanması
  volumeClaimTemplates:
  - metadata:
      name: scylla-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "fast-nvme-ssd" # K8s provider'daki ultra-hızlı disk sınıfı
      resources:
        requests:
          storage: 2Ti # Her bir node için 2 TB kapasite
