// =============================================================================
// TurkiyeMesajlasma — gRPC Protobuf Tanımları
// Dosya: crates/proto/proto/messaging.proto
// Tonic ile derlenir → Rust kaynak koduna çevrilir
//
// Servisler:
//   1. MessageGatewayService  — WS gateway'leri arası mesaj yönlendirme
//   2. PresenceService        — Node-to-node presence bildirimleri
//   3. KeyBundleService       — X3DH anahtar paketi sağlama
// =============================================================================

syntax = "proto3";

package turkiye_mesajlasma.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// option rust_package not supported by prost

// =============================================================================
// MESAJ ZAN FARI (Signal Protocol ürettiği şifreli zarfı temsil eder)
// =============================================================================

/// E2EE şifreli mesaj zarfı — sunucu içeriği açamaz
/// Signal Protocol Double Ratchet çıktısı
message EncryptedEnvelope {
    /// Hedef cihaz ID (kimin alacağını bilmemiz yeterli, içeriğini değil)
    bytes  recipient_device_id = 1;

    /// Signal mesaj tipi
    /// 1 = WHISPER_MESSAGE (normal Double Ratchet mesajı)
    /// 3 = PRE_KEY_WHISPER_MESSAGE (yeni oturum açılışı, X3DH içerir)
    /// 5 = SENDER_KEY_MESSAGE (grup mesajı)
    uint32 message_type = 2;

    /// Double Ratchet şifrelenmiş içerik (opaque binary, sunucu okuyamaz)
    bytes  ciphertext = 3;

    /// Signal Protocol registration ID (race condition tespiti için)
    uint32 registration_id = 4;

    /// Gönderici cihaz ID (alıcı tarafında session yönetimi için)
    bytes  sender_device_id = 5;

    /// Sunucu zaman damgası (istemci saati güvenilmez)
    google.protobuf.Timestamp server_timestamp = 6;

    /// İzleme için correlation ID (istemcide üretilir)
    string trace_id = 7;
}

/// Toplu mesaj zarfı (grup gönderimi için)
message BatchEnvelope {
    /// Tek gönderici
    bytes sender_user_id = 1;
    bytes sender_device_id = 2;

    /// Her alıcı cihaz için ayrı şifreli zarf (birden fazla)
    repeated EncryptedEnvelope envelopes = 3;

    /// Sohbet / grup ID (yönlendirme için)
    bytes conversation_id = 4;
    bool is_group = 5;

    google.protobuf.Timestamp client_timestamp = 6;
    string trace_id = 7;
}

/// İstemcinin WebSocket üzerinden gönderdiği ana paketleyici (Wrapper)
message ClientMessage {
    oneof payload {
        EncryptedEnvelope send_envelope = 1;
        TypingIndicatorRequest typing_indicator = 2;
        ReadReceipt read_receipt = 3;
    }
}

/// Okundu bilgisi
message ReadReceipt {
    bytes message_id = 1;
    bytes conversation_id = 2;
    google.protobuf.Timestamp read_at = 3;
}

// =============================================================================
// SERVİS 1: MessageGatewayService
// Gateway-to-Gateway mesaj yönlendirme
// Kullanıcı A (node-01) → DragonflyDB Pub/Sub → Kullanıcı B (node-03)
// =============================================================================

service MessageGatewayService {
    /// Tek bir mesaj zarfını hedef node'a ilet
    rpc ForwardEnvelope (ForwardEnvelopeRequest) returns (ForwardEnvelopeResponse);

    /// Grup mesajı: birden fazla cihaza toplu ilet
    rpc ForwardBatchEnvelope (ForwardBatchRequest) returns (ForwardBatchResponse);

    /// Offline kuyruktaki mesajları çek (cihaz online olunca)
    rpc DrainOfflineQueue (DrainQueueRequest) returns (stream EncryptedEnvelope);

    /// Node sağlık durumu (load balancer için)
    rpc HealthCheck (google.protobuf.Empty) returns (NodeHealthStatus);
}

message ForwardEnvelopeRequest {
    /// Hedef kullanıcı (yönlendirme için)
    bytes  recipient_user_id   = 1;
    bytes  recipient_device_id = 2;

    /// Şifreli zarf
    EncryptedEnvelope envelope = 3;

    /// Kaynaktan gelen trace context
    map<string, string> trace_context = 4;
}

message ForwardEnvelopeResponse {
    enum Status {
        STATUS_UNSPECIFIED   = 0;
        DELIVERED_ONLINE     = 1;  // WebSocket üzerinden anlık teslim
        QUEUED_OFFLINE       = 2;  // ScyllaDB offline kuyruğuna alındı
        FORWARDED_TO_NODE    = 3;  // Başka bir node'a yönlendirildi
        RECIPIENT_NOT_FOUND  = 4;  // Cihaz bulunamadı
    }
    Status status   = 1;
    string node_id  = 2;     // Hangi node işledi
    uint64 latency_us = 3;   // İşlem süresi (mikrosaniye)
}

message ForwardBatchRequest {
    BatchEnvelope batch = 1;
    map<string, string> trace_context = 2;
}

message ForwardBatchResponse {
    /// Her envelope için sonuç: (device_id_hex → Status)
    map<string, string> results = 1;
    uint32 delivered_count = 2;
    uint32 queued_count    = 3;
    uint32 failed_count    = 4;
}

message DrainQueueRequest {
    bytes  device_id = 1;
    /// Kaç mesaj çekilecek (sayfalandırma)
    uint32 limit     = 2;
    /// Son alınan mesaj ID'si (cursor)
    bytes  after_message_id = 3;
}

message NodeHealthStatus {
    string node_id              = 1;
    uint64 active_connections   = 2;  // Bu node'daki aktif WS bağlantıları
    float  cpu_usage_percent    = 3;
    float  memory_usage_percent = 4;
    uint64 messages_per_second  = 5;  // Son 1 dakika ortalaması
    bool   is_healthy           = 6;
    string region               = 7;
}

// =============================================================================
// SERVİS 2: PresenceService
// Kullanıcı online/offline durumu ve "yazıyor..." bildirimleri
// =============================================================================

service PresenceService {
    /// Kullanıcı online bildirimi (WS bağlandığında)
    rpc NotifyOnline (OnlineNotification) returns (google.protobuf.Empty);

    /// Kullanıcı offline bildirimi (WS kapandığında)
    rpc NotifyOffline (OfflineNotification) returns (google.protobuf.Empty);

    /// Presence değişikliklerini gerçek zamanlı dinle (SSE benzeri gRPC stream)
    rpc SubscribePresence (PresenceSubscribeRequest) returns (stream PresenceEvent);

    /// "Yazıyor..." göstergesi gönder
    rpc SendTypingIndicator (TypingIndicatorRequest) returns (google.protobuf.Empty);

    /// Toplu presence sorgusu
    rpc BatchGetPresence (BatchPresenceRequest) returns (BatchPresenceResponse);
}

message OnlineNotification {
    bytes  user_id   = 1;
    bytes  device_id = 2;
    string node_id   = 3;
    string platform  = 4;  // android, ios, web
    google.protobuf.Timestamp connected_at = 5;
}

message OfflineNotification {
    bytes  user_id   = 1;
    bytes  device_id = 2;
    string node_id   = 3;
    google.protobuf.Timestamp disconnected_at = 4;
    uint64 session_duration_ms = 5;
}

message PresenceSubscribeRequest {
    /// Bu kullanıcının, belirtilen kullanıcıların presence'ını dinlediği
    bytes subscriber_user_id = 1;
    repeated bytes watch_user_ids = 2;
}

message PresenceEvent {
    bytes  user_id = 1;
    enum Status {
        STATUS_UNSPECIFIED = 0;
        ONLINE  = 1;
        AWAY    = 2;
        BUSY    = 3;
        OFFLINE = 4;
    }
    Status status  = 2;
    google.protobuf.Timestamp last_seen = 3;
    string platform = 4;
}

message TypingIndicatorRequest {
    bytes  sender_user_id      = 1;
    bytes  sender_device_id    = 2;
    bytes  conversation_id     = 3;
    bool   is_typing           = 4;  // true=yazmaya başladı, false=durdu
}

message BatchPresenceRequest {
    repeated bytes user_ids = 1;
}

message BatchPresenceResponse {
    repeated PresenceEvent presences = 1;
}

// =============================================================================
// SERVİS 3: KeyBundleService
// X3DH için anahtar paketi sağlama
// Alice, Bob'a mesaj atmak için bu servisi çağırır
// =============================================================================

service KeyBundleService {
    /// Bir cihazın X3DH anahtar paketini al (ve bir OPK tüket)
    rpc FetchKeyBundle (KeyBundleRequest) returns (KeyBundle);

    /// Bir kullanıcının tüm aktif cihazlarının anahtar paketlerini al
    rpc FetchAllDeviceBundles (AllDeviceBundlesRequest) returns (AllDeviceBundlesResponse);

    /// OPK havuzunu doldur (mobil cihazdan sunucuya yeni anahtarlar gönder)
    rpc UploadPreKeys (UploadPreKeysRequest) returns (UploadPreKeysResponse);

    /// Cihazın OPK sayısını kontrol et (düşükse yeni yükle uyarısı ver)
    rpc CheckPreKeyCount (CheckPreKeyCountRequest) returns (CheckPreKeyCountResponse);
}

message KeyBundleRequest {
    bytes target_user_id   = 1;
    bytes target_device_id = 2;  // 0 ise birincil cihaz seçilir
}

/// X3DH anahtar paketi: Alice'in Bob'a ilk mesajı şifrelemesi için gereken her şey
message KeyBundle {
    bytes device_id = 1;

    // Identity Key (IK): Bob'un uzun vadeli kimlik anahtarı (X25519 public, 32 byte)
    bytes identity_key = 2;

    // Signed Pre-Key (SPK): 30 günde bir rotasyonlu, IK ile imzalı
    message SignedPreKey {
        uint32 key_id    = 1;
        bytes  public_key = 2;   // X25519 public key
        bytes  signature  = 3;   // Ed25519 imzası (IK ile)
    }
    SignedPreKey signed_pre_key = 3;

    // One-Time Pre-Key (OPK): Tek kullanımlık (yoksa boş, Last Resort key kullanılır)
    message OneTimePreKey {
        uint32 key_id    = 1;
        bytes  public_key = 2;
    }
    optional OneTimePreKey one_time_pre_key = 4;

    // Registration ID (Signal Protocol)
    uint32 registration_id = 5;
}

message AllDeviceBundlesRequest {
    bytes user_id = 1;
}

message AllDeviceBundlesResponse {
    repeated KeyBundle bundles = 1;
}

message UploadPreKeysRequest {
    bytes device_id = 1;

    // Yeni Signed Pre-Key (opsiyonel: rotasyon gerekiyorsa)
    optional KeyBundle.SignedPreKey signed_pre_key = 2;

    // Yeni One-Time Pre-Keys (toplu yükleme)
    repeated KeyBundle.OneTimePreKey one_time_pre_keys = 3;
}

message UploadPreKeysResponse {
    uint32 stored_one_time_count = 1;  // Sunucuda artık mevcut OPK sayısı
    bool   signed_pre_key_updated = 2;
}

message CheckPreKeyCountRequest {
    bytes device_id = 1;
}

message CheckPreKeyCountResponse {
    uint32 available_count = 1;
    bool   refill_needed   = 2;  // 10'un altına düştüyse true
    uint32 recommended_upload = 3; // 100 - available_count kadar yükle
}
