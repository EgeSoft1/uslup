# =============================================================================
# Gradle yapılandırması
#
# ── BELLEK AYARI (9 Eylül 2026) ──────────────────────────────────────────────
# Buradaki değer Flutter şablonundan geliyordu: -Xmx8G -XX:MaxMetaspaceSize=4G.
# Şablon, bol bellekli bir geliştirici makinesi varsayar.
#
# Bu projenin derlendiği makinede TOPLAM 5,9 GB RAM var. 8 GB heap isteyen bir
# JVM ya hiç başlamaz ya da takas alanına düşüp derlemeyi saatlerce sürdürür;
# aynı gün web derlemesi tam olarak bu sebeple sessizce ölmüştü.
#
# Yeni değerler tek bir APK derlemesi için ölçülü: 1,5 GB heap Flutter'ın
# Android hattı için fazlasıyla yeterli, Kotlin derleyicisi ayrı bir süreç
# açmak yerine Gradle'ın içinde çalışıyor ve paralel modül derlemesi kapalı.
#
# Daha güçlü bir makinede bu değerler yükseltilebilir; düşük olmaları
# derlemeyi yavaşlatır, imkânsız kılmaz. Tersi doğru değildir.
# =============================================================================
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Paralel modül derlemesi her modül için ayrı bellek ister; düşük bellekte
# kazançtan çok risk getirir.
org.gradle.parallel=false

# Kotlin derleyicisi ayrı bir arka plan süreci (daemon) açar ve o süreç
# derleme bittikten sonra da bellekte kalır. Bu makinede ikinci bir JVM'e
# yer yok; derleyici Gradle'ın kendi sürecinde çalışır.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.overridePathCheck=true
