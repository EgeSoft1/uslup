# =============================================================================
# TurkiyeMesajlasma - Flutter Mobil İstemci Bağımlılıkları
# Dosya: mobile/pubspec.yaml
# =============================================================================
name: turkiye_mesajlasma
# NOT: Devralınan açıklama ("150M+ CCU, Zero-lag, Ultra Şifrelenmiş...")
# 12 Ağustos 2026'da silindi. Hiçbiri ölçülmemiş, hiçbiri doğru değildi ve
# jürinin okuyacağı kaynak kodda duruyordu. Ürün artık bu değil.
description: "NSosyal Nezaket Koçu — cihaz üstü Türkçe nezaket katmanı"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Nezaket motoru — saf Dart, Flutter'sız, harici bağımlılığı yok.
  # Mobil istemci, komut satırı değerlendirme aracı ve testler AYNI paketi
  # çağırır; farklı ortamların farklı karar vermesi mümkün değildir.
  civility_core:
    path: ../packages/civility_core

  # UI / UX
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

# ── KALDIRILAN BAĞIMLILIKLAR (3 Ağustos 2026) ────────────────────────────────
# Aşağıdakiler devralınan mesajlaşma altyapısından kalmıştı ve hiçbir yerde
# kullanılmıyordu; APK'ya giriyor ama tek satır kod çalıştırmıyorlardı:
#
#   flutter_bloc, equatable  — projede tek bir BlocProvider yoktu
#   sqflite, path_provider   — sıfır import; kalıcı depolama hiç yazılmadı
#   ffi                      — sıfır import; ffi_bridge.dart onu import bile
#                              etmiyordu, tamamen sahte bir modüldü
#   web_socket_channel, uuid — yalnızca ölü WebSocket katmanında
#   protobuf                 — sıfır import
#
# ── KALDIRILAN BAĞIMLILIKLAR (24 Ağustos 2026) ───────────────────────────────
# Devralınan mesajlaşma arayüzü (sohbet, arama, kişiler, kimlik doğrulama,
# ayarlar) tamamen silindi; ürün yalnızca Sosyal Yapay Zekâ katmanından
# oluşuyor. Bu ekranlarla birlikte gereksiz kalan paketler:
#
#   cached_network_image     — yalnızca kişi avatarlarında
#   qr_flutter, mobile_scanner — yalnızca QR ile kişi ekleme
#   pinput, country_picker   — yalnızca SMS doğrulama akışında
#
# Bağlı olmayan katmanlar, çalışan çekirdeğin güvenilirliğini düşürür.
# Gerektiğinde geri eklenebilir: git geçmişinde duruyorlar.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
