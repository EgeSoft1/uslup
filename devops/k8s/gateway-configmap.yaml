apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: turkiye-mesajlasma
data:
  # Sunucu yapılandırması
  SERVER_PORT: "8080"
  METRICS_PORT: "9090"
  HEALTH_PORT: "9091"
  
  # Veritabanı bağlantı URI'leri
  COCKROACH_URL: "postgresql://root@cockroachdb:26257/turkiye_mesajlasma?sslmode=disable"
  SCYLLA_NODES: "scylladb:9042"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  DRAGONFLY_URL: "redis://dragonfly:6379"
  
  # Log ve izleme yapılandırması
  RUST_LOG: "info,gateway_ws=debug"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
