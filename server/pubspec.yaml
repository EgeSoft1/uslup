# =============================================================================
# nezaket_server — LLM Yeniden Yazma Servisi
# Dosya: server/pubspec.yaml
#
# Saf Dart HTTP servisi. Flutter YOK, framework YOK — dart:io yeterli.
# Tek bir iş yapar: cihazda çözülemeyen yeniden yazımları büyük dil modeline
# devreder ve DÖNEN ÖNERİYİ AYNI NEZAKET MOTORUYLA DOĞRULAR.
#
# Bu servis ÜRÜNÜN ZORUNLU PARÇASI DEĞİLDİR. Uygulama sunucu olmadan da
# tam çalışır (cihaz üstü motor + yerel yeniden yazıcı). Buraya yalnızca
# kullanıcı açıkça "daha iyi öneri" derse ve onay verirse istek gelir.
# =============================================================================
name: nezaket_server
description: NSosyal nezaket koçu — kullanıcı onaylı LLM yeniden yazma servisi.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  # Nezaket motoru — mobil uygulamayla BİREBİR AYNI kod.
  # Sunucunun LLM çıktısını doğrulayabilmesinin tek sebebi budur.
  civility_core:
    path: ../packages/civility_core

  # Anthropic Messages API'ye ham HTTP. Dart için resmî Anthropic SDK'sı
  # bulunmadığından REST doğrudan çağrılır.
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
