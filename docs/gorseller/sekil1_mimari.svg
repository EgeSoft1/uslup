<text x="118" y="538.0" font-size="16" fill="#1a1a1a" font-weight="bold" text-anchor="start" dominant-baseline="central">Öneri üretimi</text>
<text x="396" y="538.0" font-size="14.5" fill="#6e6864" text-anchor="start" dominant-baseline="central">Yerel, deterministik yeniden yazım</text>
<text x="450" y="584" font-size="12.5" fill="#6e6864" text-anchor="middle" dominant-baseline="central">Toplam çözümleme: 87–193 µs (AOT) — 16 ms kare bütçesinin %1,2'si</text>
