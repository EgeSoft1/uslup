<text x="118" y="476.0" font-size="16" fill="#1a1a1a" font-weight="bold" text-anchor="start" dominant-baseline="central">Bağlam çözümleme</text>
<text x="396" y="476.0" font-size="14.5" fill="#6e6864" text-anchor="start" dominant-baseline="central">saldırı / iltifat / şikâyet / öz-ifade ayrımı</text>
